# File        : tj_ctrl_csr.yaml
# Description : Register definitions for the Tianjic controller.
# Regenerate  : sh controller/csr/regen.sh
#
# Generates the APB slave, SV package, register manual, and CSR testbench.
# Edit this source and regenerate the outputs.
#
# Format: two-space indentation, block mappings, and single-line desc strings.
# Addresses are byte offsets; registers are 32 bits wide with a 4-byte stride.
# RW: read/write; RO: constant or hardware input.
# W1C: hardware set, write 1 to clear; W1S: write 1 to set target.
# PULSE: write 1 for a one-cycle pulse, reads as 0.
# impl: v2 reserves addresses without RTL; ext uses an external implementation.
# Single-field registers may put kind/bits/reset/const at register level.
# All CSRs use pclk; hardware inputs must be synchronized to pclk.
# Consumers synchronize controls sent to other clock domains.

meta:
  name: tj_ctrl_csr
  version: "0.1.0"
  apb_aw: 16
  data_w: 32

blocks:
  # Global identification, control, and status.
  - name: GLB
    base: 0x0000
    size: 0x100
    desc: "控制器标识、控制与状态。"
    regs:
      - name: ID
        offset: 0x00
        kind: RO
        const: 0x544A4331
        desc: "控制器标识 TJC1（ASCII）。"

      - name: VERSION
        offset: 0x04
        kind: RO
        const: 0x00000100
        desc: "寄存器版本：[23:16]主版本，[15:8]次版本，[7:0]补丁版本。"

      - name: SCRATCH
        offset: 0x08
        kind: RW
        desc: "APB 读写自检，无控制副作用。"

      - name: CTRL
        offset: 0x0C
        desc: "引擎软复位控制。"
        fields:
          - name: SRST
            bits: 0
            kind: PULSE
            desc: "写1发起引擎软复位请求，读回0；不清除CSR配置。SEND停止新请求，排空在途AXI后归闲，不置DONE/ERR；RECV清空通道缓冲并暂时停收，排空在途B响应后恢复，保留WPTR/RPTR。"

      - name: STA
        offset: 0x10
        desc: "SPI/BOOT/SEND/CC 忙状态汇总。"
        fields:
          - name: SPI_BUSY
            bits: "7:0"
            kind: RO
            desc: "各SPI引擎实际占用状态，含SPIWIN访问；门铃事务状态见各组SPI.STA.BUSY。"

          - name: BOOT_BUSY
            bits: 8
            kind: RO
            desc: "BOOT 引擎忙。"

          - name: SEND_BUSY
            bits: 9
            kind: RO
            desc: "SEND 整体忙状态，包含取数和分发。"

          - name: CC_BUSY
            bits: 10
            kind: RO
            desc: "FPGA 侧 LVDS 配置链忙。"

  # Interrupt control and status.
  - name: IRQ
    base: 0x0100
    size: 0x100
    desc: "中断汇聚(事件位分配:详见手册附注;irq[3:0] 线映射在顶层)"
    regs:
      - name: RAW
        offset: 0x00
        kind: W1C
        desc: "原始事件,硬件置位、写 1 清零。[7:0]=SPI 完成 [8]=BOOT 完成 [9]=SEND 完成/记录 irq 标志(同表多个 irq 标志合并为首次一报,进度以 SEND.SENT 追踪) [10]=CC 完成 [11]=TRACE 回绕 [23:12]=RECV 通道事件 [24]=SPI 超时 [25]=ECC 不可纠 [26]=链路停滞 [27]=RECV 溢出 [28]=AXI 响应错 [29]=BOOT 错 [31:30]=保留"

      - name: EN
        offset: 0x04
        kind: RW
        desc: "事件使能掩码(1=参与 STA 与 irq 线)"

      - name: STA
        offset: 0x08
        kind: RO
        ro_expr: "RAW & EN"
        hwo: true
        desc: "生效中断 = RAW & EN(只读派生)"

      - name: TST
        offset: 0x0C
        kind: W1S
        target: RAW
        desc: "测试注入:写 1 置位 RAW 对应位(探微集成联调中断链路用)"

  # System reset, clock enables, and timestamp.
  - name: SYS
    base: 0x0200
    size: 0x100
    desc: "芯片复位、时钟缓冲器使能与时间戳。"
    regs:
      - name: RST_LEVEL
        offset: 0x00
        kind: RW
        desc: "chip_rst_n[31:0]控制电平：0=保持复位，1=释放复位，复位值0。整字写入；读回设置值，不表示芯片就绪。错峰释放复位由Host更新位掩码并延时实现。"

      - name: CLK_CTL
        offset: 0x04
        kind: RW
        bits: "3:0"
        desc: "LMK1C1108时钟缓冲器使能输出clkctl[3:0]，复位值0；各位映射由板级连接定义。"

      - name: TS_CTRL
        offset: 0x08
        desc: "48位时间戳控制，上行记录tag取低16位；写入同时更新EN/PRESC。"
        fields:
          - name: EN
            bits: 0
            kind: RW
            desc: "1=计数，0=暂停并保持计数值。"

          - name: PRESC
            bits: "2:1"
            kind: RW
            desc: "maxi_clk预分频：0=/1，1=/16，2=/100，3=/1000；编码见tj_ts_div_e。"

          - name: CLR
            bits: 8
            kind: PULSE
            desc: "写1发出清零请求，读回0；读回值不表示清零已完成。"

      - name: TS_LO
        offset: 0x0C
        kind: RO
        desc: "时间戳[31:0]。输入须为同步到pclk域的完整48位一致快照；连续计数时按TS_HI、TS_LO、TS_HI顺序读取，高位不同则重试。停计读取须等待停计生效及快照更新。"

      - name: TS_HI
        offset: 0x10
        kind: RO
        bits: "15:0"
        desc: "时间戳[47:32]；本寄存器[31:16]读回0。完整读法见TS_LO。"

  # SPI transaction control and status.
  - name: SPI
    base: 0x0400
    size: 0x400
    count: 8
    stride: 0x80
    desc: "SPI组控制与状态；逻辑接口为组内4个die共用SCLK/MOSI、独立CS/MISO。CLKDIV/TMO与SPIWIN、BOOT共用。"
    regs:
      - name: CMD
        offset: 0x00
        desc: "门铃事务类型与目标die。"
        fields:
          - name: KIND
            bits: "1:0"
            kind: RW
            desc: "0=32位单写（0x00），1=32位单读（引擎完成0x06请求和0x04取数）；2/3保留，当前为空操作，置DONE且不发SPI事务。"

          - name: DIE
            bits: "5:4"
            kind: RW
            desc: "组内die编号0～3，对应逻辑片选cs_n[组号*4+DIE]。"

      - name: ADDR
        offset: 0x04
        kind: RW
        desc: "芯片侧32位AHB字节地址，须4字节对齐。"

      - name: WDATA
        offset: 0x08
        kind: RW
        desc: "32位单写数据（KIND=0）。"

      - name: RDATA
        offset: 0x0C
        kind: RO
        desc: "32位单读返回值，KIND=1且本次事务正常完成后有效。"

      - name: CLKDIV
        offset: 0x10
        kind: RW
        bits: "7:0"
        reset: 0x04
        desc: "SCLK=pclk/[2*(DIV_eff+1)]，DIV_eff=max(CLKDIV,1)；写0回读0，实际按1处理。软件须保证SCLK≤芯片sys_clk/4且≤25MHz。"

      - name: TMO
        offset: 0x14
        kind: RW
        reset: 0x000F4240
        desc: "SPI引擎执行超时阈值，单位pclk周期，0=关闭。从引擎接受命令后计时，不含等待仲裁。超时中止传输并拉高CS，保持引擎忙且不接收新命令，等待普通帧间隔或块排空间隔后报告错误，不自动重试。写超时不保证撤销写入；单写和块写均可能改写目标地址或芯片此前锁存的地址，块写目标区须视为不可靠。"

      - name: DB
        offset: 0x18
        desc: "事务启动请求。"
        fields:
          - name: GO
            bits: 0
            kind: PULSE
            desc: "空闲时写1请求执行CMD/ADDR/WDATA指定的事务；忙时忽略且不排队，读回0。"

      - name: STA
        offset: 0x1C
        desc: "门铃事务状态；DONE/ERR_TMO读不清、写1清、写0无影响，新GO不清除旧标志。"
        fields:
          - name: BUSY
            bits: 0
            kind: RO
            desc: "1=本门铃事务等待仲裁或执行中。"

          - name: DONE
            bits: 8
            kind: W1C
            desc: "事务完成事件。"

          - name: ERR_TMO
            bits: 9
            kind: W1C
            desc: "本门铃事务超时事件。"

      - name: BUF
        offset: 0x40
        size: 0x40
        impl: v2
        desc: "预留16×32位数据缓冲，当前不生成RTL。"

  # Firmware loading and core boot.
  - name: BOOT
    base: 0x0800
    size: 0x100
    desc: "引导引擎:DDR → SPI 事务层流式通路(固件装载/引导原语共用同一条数据路)"
    regs:
      - name: CMD
        offset: 0x00
        desc: "操作命令"
        fields:
          - name: KIND
            bits: "1:0"
            kind: RW
            desc: "0=FW_LOAD(DDR→ILM/DLM,WR16 流)1=BOOT_PRIM(DDR 模板→core cfg 窗口,引擎带 CLK_SHIFT 序列);2 保留(v2:MBOX_POLL)"

          - name: DIE
            bits: "8:4"
            kind: RW
            desc: "目标 die 全局编号 0~31(多 die 由 host 循环敲门)"

      - name: SRC_LO
        offset: 0x04
        kind: RW
        desc: "DDR 源地址 [31:0],64B 对齐(BOOT_PRIM 时指向 2 行引导原语模板,模板由驱动预置于 DDR)"

      - name: SRC_HI
        offset: 0x08
        kind: RW
        bits: "15:0"
        desc: "DDR 源地址 [47:32]"

      - name: LEN
        offset: 0x0C
        kind: RW
        desc: "长度(字节,64 的倍数);BOOT_PRIM 时=引导链行数×32B(1~4 条 Recv+Stop,可变长——普通核 2 行、LVDS 入口核 3 行,模板由驱动置于 DDR)"

      - name: DST
        offset: 0x10
        kind: RW
        desc: "芯片侧目标基址:FW_LOAD=ILM/DLM 地址;BOOT_PRIM=目标 core cfg 基址"

      - name: DB
        offset: 0x14
        desc: "门铃"
        fields:
          - name: GO
            bits: 0
            kind: PULSE
            desc: "写 1 发起"

      - name: STA
        offset: 0x18
        desc: "状态"
        fields:
          - name: BUSY
            bits: 0
            kind: RO
            desc: "进行中"

          - name: DONE
            bits: 8
            kind: W1C
            desc: "完成"

          - name: ERR
            bits: 9
            kind: W1C
            desc: "出错(见 ERR_CODE)"

          - name: ERR_CODE
            bits: "15:12"
            kind: RO
            desc: "1=SPI 超时 2=AXI 读错 3=长度非法 其余保留"

  # DDR-to-LVDS record transfer.
  - name: SEND
    base: 0x0C00
    size: 0x100
    desc: "下行 SEND 引擎:DDR 记录表 → 解析 → 按 ch 重映射分发 → LVDS 缝"
    regs:
      - name: SRC_LO
        offset: 0x00
        kind: RW
        desc: "记录表 DDR 基址 [31:0],64B 对齐(低 6bit 硬件强制清零);门铃前程序、发送中勿改(跨域采样契约)"

      - name: SRC_HI
        offset: 0x04
        kind: RW
        bits: "15:0"
        desc: "记录表 DDR 基址 [47:32]"

      - name: CNT
        offset: 0x08
        kind: RW
        desc: "记录条数(16B/条;0=空表立即 DONE);门铃前程序、发送中勿改"

      - name: DB
        offset: 0x0C
        desc: "门铃"
        fields:
          - name: GO
            bits: 0
            kind: PULSE
            desc: "写 1 启动一次表发送(遇 flags.last 或计满 CNT 停);BUSY=1 时门铃被丢弃"

      - name: STA
        offset: 0x10
        desc: "状态"
        fields:
          - name: BUSY
            bits: 0
            kind: RO
            desc: "发送中(取数或分发未清)"

          - name: DONE
            bits: 8
            kind: W1C
            desc: "本表处理完成(有错也置,错误详情看 ERR)"

          - name: ERR
            bits: 9
            kind: W1C
            desc: "AXI 读错(表中止)或记录非法/通道未使能(该记录丢弃、表继续)"

      - name: SENT
        offset: 0x14
        kind: RO
        desc: "缝上被接受的记录计数(门铃清零;丢弃不计;跨域直采——运行中读数为参考值,DONE 后精确)"

  # LVDS-to-DDR receive rings.
  - name: RECV
    base: 0x1000
    size: 0x1000
    count: 12
    impl_count: 3
    stride: 0x40
    desc: "上行 RECV 通道(每 LVDS 逻辑 ch 一套环形缓冲;v1 例化 3 通道,4~12 预留)"
    regs:
      - name: RING_LO
        offset: 0x00
        kind: RW
        desc: "DDR 环形缓冲基址 [31:0],64B 对齐;仅 EN=0 时修改(跨域采样契约)"

      - name: RING_HI
        offset: 0x04
        kind: RW
        bits: "15:0"
        desc: "环形缓冲基址 [47:32]"

      - name: SIZE
        offset: 0x08
        kind: RW
        desc: "环容量(记录条数,2 的幂);仅 EN=0 时修改"

      - name: WMARK
        offset: 0x0C
        kind: RW
        desc: "水线阈值(落地记录数自下而上越过阈值时打事件沿);仅 EN=0 时修改"

      - name: CTRL
        offset: 0x10
        desc: "通道控制"
        fields:
          - name: EN
            bits: 0
            kind: RW
            desc: "通道使能(0=丢弃入包)"

          - name: OVF_POLICY
            bits: 1
            kind: RW
            desc: "环满策略 0=丢新包(计 OVF)1=反压链路(REQ-DAT-14 二级)"

          - name: IE_WMARK
            bits: 8
            kind: RW
            desc: "水线事件参与 IRQ.RAW 通道位"

          - name: IE_END
            bits: 9
            kind: RW
            desc: "end 包事件参与 IRQ.RAW 通道位"

      - name: STA
        offset: 0x14
        desc: "通道状态(事件位按 B 落地口径置位——中断到达时记录必已在 DDR;密集事件限速合并为一次置位,计数以 WPTR/LEVEL 为准)"
        fields:
          - name: WMARK_HIT
            bits: 0
            kind: W1C
            desc: "水线越线沿(自下而上跨过 WMARK)"

          - name: ENDPKT
            bits: 1
            kind: W1C
            desc: "END 包(ptype=0100)记录落地;该记录 flags[0]=1"

          - name: OVF
            bits: 2
            kind: W1C
            desc: "发生过丢包(策略 0 环满)"

          - name: LEVEL
            bits: "31:16"
            kind: RO
            desc: "当前在环记录数(跨域直采参考值;静默后精确)"

      - name: WPTR
        offset: 0x18
        kind: RO
        desc: "硬件写指针=已落地记录累计数(自由递增,寻址=WPTR&(SIZE-1);跨域直采参考值)"

      - name: RPTR
        offset: 0x1C
        kind: RW
        desc: "host 读指针(消费后回写同序列累计值;须单调、两次回写间隔 ≥4 pclk——硬件经两拍一致性滤波采信,撕裂过渡值被拒收)"

  # LVDS channel control.
  - name: LNK
    base: 0x2000
    size: 0x100
    desc: "链路控制(lvds_subsys 之上的通道使能/重映射/计数)"
    regs:
      - name: EN
        offset: 0x00
        kind: RW
        bits: "11:0"
        desc: "逻辑通道使能位图(v1 有效 [2:0])"

      - name: REMAP0
        offset: 0x04
        kind: RW
        reset: 0x76543210
        desc: "逻辑 ch0~7 → 物理组号,4bit/ch(坐标保险丝:板间接线颠倒时软件补救)"

      - name: REMAP1
        offset: 0x08
        kind: RW
        bits: "15:0"
        reset: 0xBA98
        desc: "逻辑 ch8~11 → 物理组号,4bit/ch"

      - name: FC_TMO
        offset: 0x0C
        kind: RW
        reset: 0x000F4240
        desc: "链路停滞超时(REQ-LNK-09,RESEND/WAIT 单发丢失死锁的解套计时,pclk 周期)"

      - name: CNT_SEL
        offset: 0x10
        desc: "计数器窗口选择(间接读,省地址)"
        fields:
          - name: CH
            bits: "3:0"
            kind: RW
            desc: "通道号"

          - name: KIND
            bits: "11:8"
            kind: RW
            desc: "0=rx包 1=tx包 2=ECC可纠 3=ECC不可纠 4=RESEND 5=WAIT 6=校准事件 其余保留"

      - name: CNT_VAL
        offset: 0x14
        kind: RO
        desc: "CNT_SEL 选中的计数值"

      - name: STA
        offset: 0x18
        kind: RO
        bits: "7:0"
        desc: "链路状态(实例 0:位分配随 C1 定,含 rx 就绪/校准完成)"

  # PRBS link testing.
  - name: PRBS
    base: 0x2800
    size: 0x100
    impl: v2
    desc: "PRBS 扫频引擎(阶段 2/批次 C5 就位,M3 上板扫链路窗口用;地址先占)"
    regs:
      - name: CTRL
        offset: 0x00
        impl: v2
        desc: "启停/方向/图样选择(K28.5 PRBS7 / K28.6 PRBS15)"

      - name: CYCLES
        offset: 0x04
        impl: v2
        desc: "测试时长(符号数)"

      - name: ERR_CNT
        offset: 0x08
        impl: v2
        desc: "误码计数"

      - name: BIT_CNT
        offset: 0x0C
        impl: v2
        desc: "累计比特数"

      - name: STA
        offset: 0x10
        impl: v2
        desc: "运行状态/锁定指示"

  # Packet trace buffer.
  - name: TRACE
    base: 0x3000
    size: 0x100
    desc: "包 trace 环形缓存(REQ-DBG-02;片上 BRAM,APB 窗口回读)"
    regs:
      - name: CTRL
        offset: 0x00
        desc: "捕获控制"
        fields:
          - name: EN
            bits: 0
            kind: RW
            desc: "捕获使能"

          - name: WRAP
            bits: 1
            kind: RW
            desc: "1=环绕覆盖 0=满即停"

          - name: SRC
            bits: "11:8"
            kind: RW
            desc: "捕获源掩码 bit8=TX bit9=RX 其余保留"

      - name: STA
        offset: 0x04
        desc: "捕获状态"
        fields:
          - name: COUNT
            bits: "15:0"
            kind: RO
            desc: "已捕获记录数"

          - name: WRAPPED
            bits: 16
            kind: RO
            desc: "已发生环绕"

      - name: ADDR
        offset: 0x08
        kind: RW
        bits: "15:0"
        desc: "回读记录索引(写后需经一笔 APB 事务延迟再读 DATA*,由 APB 时序自然满足)"

      - name: DATA0
        offset: 0x0C
        kind: RO
        desc: "记录 [31:0](16B 记录格式见需求文档 §5)"

      - name: DATA1
        offset: 0x10
        kind: RO
        desc: "记录 [63:32]"

      - name: DATA2
        offset: 0x14
        kind: RO
        desc: "记录 [95:64]"

      - name: DATA3
        offset: 0x18
        kind: RO
        desc: "记录 [127:96]"

  # SPI window control.
  - name: SPIWIN
    base: 0x3C00
    size: 0x100
    desc: "SPI 透明转发窗口页寄存器(0804 会议定语义:host 对窗体的每笔读写=一笔 SPI 事务;窗体在 0x4000~0x4FFF,由 SPIWIN 模块实现)"
    regs:
      - name: CTRL
        offset: 0x00
        desc: "窗口控制"
        fields:
          - name: EN
            bits: 0
            kind: RW
            desc: "窗口使能;0 时窗体访问返回 pslverr"

      - name: PAGE
        offset: 0x04
        desc: "页选择"
        fields:
          - name: DIE
            bits: "4:0"
            kind: RW
            desc: "目标 die 全局编号 0~31(组=DIE 除 4,片选=cs_n[DIE])"

      - name: OFFS
        offset: 0x08
        kind: RW
        bits: "19:0"
        desc: "芯片侧地址高 20 位,即会议所说统一 Offset;芯片地址 = {OFFS, 窗内偏移[11:0]}"

      - name: STA
        offset: 0x0C
        desc: "窗口状态"
        fields:
          - name: BUSY
            bits: 0
            kind: RO
            desc: "窗口事务在途"

          - name: ERR_TMO
            bits: 8
            kind: W1C
            desc: "窗口事务超时(引擎看门狗中止;读写均在当笔以 pslverr 结束)"

  # SPI access window.
  - name: WIN
    base: 0x4000
    size: 0x1000
    impl: ext
    desc: "SPI 直通窗体(SPIWIN 模块实现,CSR 从机不解码本区间):读写窗内地址 = 对 {OFFS,偏移} 的一笔 SPI 单字事务;读写均以 pready 等待周期阻塞至 SPI 完成(约 10µs @10MHz SCLK),超时/未使能当笔 pslverr"
    regs:
      - name: WIN
        offset: 0x00
        size: 0x1000
        impl: ext
        desc: "4KB 直通窗体(字对齐;完成语义见 SPIWIN 块)"

  # LVDS configuration-chain master.
  - name: CC
    base: 0x3800
    size: 0x100
    desc: "FPGA侧lvds_subsys配置链主机，33位链协议；pclk与目标实例的配置/APB时钟须同域。"
    regs:
      - name: CMD
        offset: 0x00
        desc: "选择链操作和本地LVDS实例。"
        fields:
          - name: KIND
            bits: "1:0"
            kind: RW
            desc: "0=写地址拍，1=写数据拍，2/3=读地址拍并等待返回；读操作无需先发KIND=0。"

          - name: INST
            bits: "5:4"
            kind: RW
            desc: "本地lvds_subsys实例ID，与目标CORE_ID匹配；v1仅用0，不是芯片die编号。"

      - name: WDATA
        offset: 0x04
        kind: RW
        desc: "KIND=0/2/3时，低25位为本地LVDS CSR字节偏移（如0x220），不是芯片AHB地址；KIND=1时为完整32位写数据。"

      - name: RDATA
        offset: 0x08
        kind: RO
        desc: "最近一次配置链读回值；仅在本次读的新DVLD置1后有效。"

      - name: DB
        offset: 0x0C
        desc: "写操作依次发地址拍和数据拍，每拍等BUSY清零，期间不可插入其他链操作；写无返回确认，需验证时读回。"
        fields:
          - name: GO
            bits: 0
            kind: PULSE
            desc: "写1发起CMD/WDATA指定的一拍；只在空闲接收，忙时忽略且不排队，读回0。"

      - name: STA
        offset: 0x10
        desc: "链操作状态；读超时仅清BUSY、不置DVLD。确认本次请求已处理且BUSY=0后，以新DVLD判断读回是否成功。"
        fields:
          - name: BUSY
            bits: 0
            kind: RO
            desc: "链操作进行中；写拍发送完即清零，读操作等待返回或超时结束。"

          - name: DVLD
            bits: 8
            kind: W1C
            desc: "读回锁存标志，硬件收到返回时置1；读不清，GO不清，写1清除。每次读前清旧标志；写操作不置位。"
